[project]
name = "personal-finance"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1,<4",
    "python-dotenv>=1.0,<2",
    "requests>=2.32,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.6,<0.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
