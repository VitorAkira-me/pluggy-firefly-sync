services:
  pluggy-firefly-sync:
      build: .
          container_name: pluggy-firefly-sync
              restart: unless-stopped
                  # host: pra "umbrel.local" resolver igual resolveria rodando direto no Pi.
                      # Se der erro de conexao com o Firefly, troque por "bridge" e ajuste
                          # FIREFLY_BASE_URL no .env pro nome do container do Firefly na rede do
                              # Umbrel (ex: http://firefly_iii_web_1:80) - nao tenho como confirmar
                                  # esse nome sem ver o seu Portainer, me manda a lista de containers que
                                      # eu te ajudo a achar o certo.
                                          network_mode: host
                                              # As variaveis abaixo NAO vem de um arquivo .env dentro do repositorio
                                                  # (o .env com suas chaves reais nunca deve ir pro GitHub). Elas sao
                                                      # substituidas pelos valores cadastrados na propria tela do Portainer
                                                          # (Stacks -> pluggy-firefly-sync -> Environment variables), entao os
                                                              # segredos ficam so no Portainer, nunca no Git.
                                                                  environment:
                                                                        PLUGGY_CLIENT_ID: ${PLUGGY_CLIENT_ID}
                                                                              PLUGGY_CLIENT_SECRET: ${PLUGGY_CLIENT_SECRET}
                                                                                    FIREFLY_BASE_URL: ${FIREFLY_BASE_URL}
                                                                                          FIREFLY_TOKEN: ${FIREFLY_TOKEN}
                                                                                                NOTIFY_CHANNEL: ${NOTIFY_CHANNEL}
                                                                                                      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
                                                                                                            TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
                                                                                                                  WEBHOOK_URL: ${WEBHOOK_URL}
                                                                                                                        MONTHLY_SAVINGS_TARGET: ${MONTHLY_SAVINGS_TARGET}
                                                                                                                              SAFETY_BUFFER: ${SAFETY_BUFFER}
                                                                                                                                  # account_mapping.json e category_rules.json NAO sao mais montados como
                                                                                                                                      # volume aqui: eles ja vao dentro da imagem (copiados pelo Dockerfile a
                                                                                                                                          # partir do repositorio). Pra atualizar, edite o arquivo no GitHub e
                                                                                                                                              # clique em "Pull and redeploy" na stack do Portainer.
                                                                                                                                                  volumes:
                                                                                                                                                        - ./logs:/app/logs
