# Stack do Portainer, método "Repository" (Git) apontando pra este repositório.
# Mudou o código no GitHub? Stacks -> personal-finance -> "Pull and redeploy".
services:
  personal-finance:
    build: .
    pull_policy: build          # reconstrói a imagem a cada redeploy (senão usa a antiga em cache)
    container_name: personal-finance
    restart: unless-stopped
    # host: alcança o Firefly em 127.0.0.1:30009 e o Ollama pelo Tailscale do Umbrel. O container não abre
    # nenhuma porta (bot usa long polling, só conexões de saída). Ver docs/decisions/0007.
    network_mode: host
    # Valores vêm de Stacks -> Environment variables no Portainer. Nunca do Git.
    environment:
      PLUGGY_CLIENT_ID: ${PLUGGY_CLIENT_ID}
      PLUGGY_CLIENT_SECRET: ${PLUGGY_CLIENT_SECRET}
      FIREFLY_BASE_URL: ${FIREFLY_BASE_URL:-http://127.0.0.1:30009}
      FIREFLY_TOKEN: ${FIREFLY_TOKEN}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      TELEGRAM_USER_ID: ${TELEGRAM_USER_ID:-}
      # Mapeamento de contas (tem ids financeiros, por isso fica fora do Git): JSON numa linha só
      ACCOUNT_MAPPING_JSON: ${ACCOUNT_MAPPING_JSON:-}
      MONTHLY_SAVINGS_TARGET: ${MONTHLY_SAVINGS_TARGET:-0}
      SAFETY_BUFFER: ${SAFETY_BUFFER:-0}
      REPORT_HOUR_UTC: ${REPORT_HOUR_UTC:-8}
      SYNC_EVERY_HOURS: ${SYNC_EVERY_HOURS:-3}
      REVIEW_HOUR_UTC: ${REVIEW_HOUR_UTC:-6}
      # Mesmo valor do LLM_LOCAL_URL do pokemon-radar (IP do KaviPC no Tailscale, porta 11434)
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b-instruct}
    # Volume só em /data (estado: faturas informadas, fila de revisão, aulas, offset do bot).
    # Nunca montar nada por cima de /app: esconde arquivos da imagem (quebrou o deploy em set/2026).
    volumes:
      - personal_finance_data:/data
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}

volumes:
  personal_finance_data:
